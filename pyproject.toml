[project]
name = "polyquery-mcp"
version = "1.0.0"
description = "Multi-database query MCP tool supporting PostgreSQL, MySQL, MongoDB, Redis, and Oracle"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["mcp", "database", "query", "postgresql", "mysql", "mongodb", "redis", "oracle", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 核心依赖（最小化）
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

# 可选依赖（按需安装）
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.1.0"]
mongodb = ["pymongo>=4.0.0"]
redis = ["redis>=5.0.0"]
oracle = ["oracledb>=2.0.0"]
all = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "pymongo>=4.0.0",
    "redis>=5.0.0",
    "oracledb>=2.0.0",
]

[project.scripts]
polyquery-mcp = "mcp_db.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/polyquery-mcp"
Repository = "https://github.com/yourusername/polyquery-mcp"
Issues = "https://github.com/yourusername/polyquery-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_db"]
